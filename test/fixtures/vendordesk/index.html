<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VendorDesk</title>
<style>
  :root {
    --fg: #1a1d21;
    --muted: #5f6368;
    --border: #d4d7dc;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --accent: #2457c1;
    --success: #1e7a34;
    --success-bg: #e7f6ea;
    --error: #b3261e;
    --error-bg: #fce8e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header.app-header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.app-header h1 { font-size: 1.25rem; margin: 0; }
  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .field { margin-bottom: 1rem; }
  label { display: block; font-weight: 600; font-size: 0.875rem; margin-bottom: 0.25rem; }
  input, select, textarea {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--panel);
    color: var(--fg);
  }
  input:focus, select:focus, textarea:focus, button:focus {
    outline: 3px solid #90b4f9;
    outline-offset: 1px;
  }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.6rem 1.1rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1d47a0; }
  button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--bg); }
  #status {
    margin: 1rem 0;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    display: none;
  }
  #status.success { display: block; background: var(--success-bg); color: var(--success); }
  #status.error { display: block; background: var(--error-bg); color: var(--error); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 600; }
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-panel { width: 100%; max-width: 360px; }
</style>
</head>
<body>

<div id="login-view" class="login-wrap" hidden>
  <div class="panel login-panel">
    <h1 style="margin-top:0;">VendorDesk</h1>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" required autocomplete="current-password" />
        <p class="hint">Demo password: demo</p>
      </div>
      <button type="submit">Sign in</button>
    </form>
    <p id="login-status" role="alert" style="color:var(--error);"></p>
  </div>
</div>

<div id="app-view" hidden>
  <header class="app-header">
    <h1>VendorDesk</h1>
    <button type="button" class="secondary" id="signout-btn">Sign out</button>
  </header>
  <main>
    <section class="panel">
      <h2 style="margin-top:0;">New invoice</h2>
      <form id="invoice-form">
        <div class="grid-2">
          <div class="field">
            <label for="vendor-name">Vendor name</label>
            <input id="vendor-name" name="vendorName" type="text" required />
          </div>
          <div class="field">
            <label for="gstin">GSTIN</label>
            <input id="gstin" name="gstin" type="text" required placeholder="07AABCS1429B1Z5" />
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="invoice-no">Invoice number</label>
            <input id="invoice-no" name="invoiceNo" type="text" required />
          </div>
          <div class="field">
            <label for="invoice-date">Invoice date</label>
            <input id="invoice-date" name="date" type="date" required />
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="amount">Amount (₹)</label>
            <input id="amount" name="amount" type="number" step="0.01" required />
          </div>
          <div class="field">
            <label for="gst-rate">GST rate</label>
            <select id="gst-rate" name="gstRate">
              <option value="0">0%</option>
              <option value="5">5%</option>
              <option value="12" selected>12%</option>
              <option value="18">18%</option>
              <option value="28">28%</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="office_supplies">Office supplies</option>
            <option value="travel">Travel</option>
            <option value="software">Software</option>
            <option value="logistics">Logistics</option>
            <option value="utilities">Utilities</option>
          </select>
        </div>
        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="3"></textarea>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
        <button type="submit">Save invoice</button>
      </form>
    </section>

    <section class="panel">
      <h2 style="margin-top:0;">Saved invoices</h2>
      <table>
        <thead>
          <tr>
            <th>Vendor</th>
            <th>GSTIN</th>
            <th>Invoice no.</th>
            <th>Date</th>
            <th>Amount</th>
            <th>GST</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="invoice-rows"></tbody>
      </table>
    </section>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
